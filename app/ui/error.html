<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Page not available</title>
<style>
html,body{height:100%;margin:0;background:#0d0b0a;color:#ece5da;font-family:"Bahnschrift","Segoe UI",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:12vh 24px 0}
.mark{width:44px;height:44px;border:2px solid #c8a45a;border-radius:50%;position:relative;margin-bottom:22px}
.mark:after{content:"";position:absolute;left:50%;top:-8px;width:2px;height:60px;background:#c8a45a;transform:rotate(35deg)}
h1{font-weight:500;letter-spacing:.04em;text-transform:uppercase;font-size:1.5rem;margin:0 0 10px}
p{color:#a3988a;line-height:1.6;margin:0 0 10px}
code{color:#ece5da;word-break:break-all}
button{margin-top:14px;background:#c8a45a;color:#14100d;border:0;padding:10px 18px;font:inherit;font-weight:600;letter-spacing:.04em;cursor:pointer;border-radius:3px}
</style></head><body><main>
<div class="mark" aria-hidden="true"></div>
<h1>This page did not load</h1>
<p id="why"></p><p><code id="u"></code></p>
<p>Check that you are online, then try again. If only this site fails, it may be down for everyone.</p>
<button id="retry">Try again</button>
<script src="error.js"></script>
</main></body></html>
